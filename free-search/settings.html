<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>免费联网搜索 · 设置</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 4px 2px 12px;
    font: 13px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
    color: var(--text-primary, #1a1a1a);
  }
  h2 {
    margin: 18px 0 6px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .04em;
    color: var(--text-secondary, #6b6b66);
    text-transform: none;
  }
  h2:first-child { margin-top: 2px; }
  .hint {
    margin: 0 0 8px;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-secondary, #6b6b66);
  }
  .card {
    border: 1px solid var(--border-default, #e4e4e0);
    border-radius: 8px;
    overflow: hidden;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-top: 1px solid var(--border-default, #e4e4e0);
  }
  .row:first-child { border-top: 0; }
  .row.is-off .name { color: var(--text-tertiary, #9a9a94); }
  .row.is-off .note { opacity: .5; }
  input[type="checkbox"] { flex: none; margin: 0; }
  .name { font-weight: 500; flex: none; min-width: 92px; }
  .tag {
    flex: none;
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 4px;
    background: var(--surface-hover, #f0f0ec);
    color: var(--text-secondary, #6b6b66);
  }
  .tag.key { background: var(--warning-bg, #fdf4e3); color: var(--warning-text, #8a5a00); }
  .note {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 12px;
    color: var(--text-secondary, #6b6b66);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .move { display: flex; flex: none; gap: 2px; }
  button {
    font: inherit;
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 6px;
    border: 1px solid var(--border-default, #e4e4e0);
    background: var(--surface, #fff);
    color: inherit;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--surface-hover, #f0f0ec); }
  button:disabled { opacity: .35; cursor: default; }
  button.icon { padding: 2px 6px; line-height: 1.2; font-size: 11px; }
  button.primary {
    background: var(--accent, #1a1a1a);
    border-color: var(--accent, #1a1a1a);
    color: #fff;
  }
  button.primary:hover:not(:disabled) { opacity: .88; background: var(--accent, #1a1a1a); }
  /* 有 key 的引擎：按钮变成低饱和的「已配置」样式，一眼能扫出哪些配好了 */
  button.haskey {
    border-color: var(--success-border, #b6ddc4);
    color: var(--success-text, #1a7f4b);
    background: var(--success-bg, #f0f9f3);
  }
  .footer { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .status { font-size: 12px; color: var(--text-secondary, #6b6b66); }
  .status.ok { color: var(--success-text, #1a7f4b); }
  .status.bad { color: var(--danger-text, #b3261e); }
  .result {
    margin-top: 8px;
    padding: 8px 10px;
    border-radius: 6px;
    background: var(--surface-sunken, #f7f7f5);
    font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 220px;
    overflow-y: auto;
  }
  .result:empty { display: none; }
  input[type="text"], input[type="password"] {
    width: 100%;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border-default, #e4e4e0);
    background: var(--surface, #fff);
    color: inherit;
  }
  .grid2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
  }
  @media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
  label.field { display: block; font-size: 12px; color: var(--text-secondary, #6b6b66); }
  label.field span { display: block; margin-bottom: 4px; }

  /* 逐引擎 key 编辑：点「设置 key」后在这一行下面展开 */
  .keyedit {
    display: none;
    padding: 9px 10px 10px 34px;
    border-top: 1px dashed var(--border-default, #e4e4e0);
    background: var(--surface-sunken, #f7f7f5);
  }
  .keyedit.open { display: block; }
  .keyedit .line { display: flex; align-items: center; gap: 6px; }
  .keyedit .note { margin: 0 0 7px; white-space: normal; }
  .keyedit .msg { font-size: 12px; margin-top: 6px; min-height: 1em; }

  /* 行内测试结果：点「测」后在这一行下面出现，成功绿、失败红 */
  .testline {
    display: none;
    padding: 5px 10px 7px 34px;
    border-top: 1px dashed var(--border-default, #e4e4e0);
    background: var(--surface-sunken, #f7f7f5);
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-secondary, #6b6b66);
  }
  .testline.show { display: block; }
  .testline.ok { color: var(--success-text, #1a7f4b); }
  .testline.bad { color: var(--danger-text, #b3261e); }
  .testline .sample {
    display: block;
    margin-top: 2px;
    color: var(--text-tertiary, #9a9a94);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* 测试中：按钮转圈态（只有文字，不做动画，避免干扰） */
  button.testing { opacity: .55; }
</style>
</head>
<body>

<h2>引擎链路</h2>
<p class="hint">从上到下依次尝试，某个引擎失败就自动换下一个。取消勾选即从链路移除；需要 key 的引擎点右侧按钮单独配置。</p>
<div class="card" id="engineList"></div>
<div class="footer">
  <button class="primary" id="saveOrder">保存链路</button>
  <span class="status" id="orderStatus"></span>
</div>

<h2>搜索默认值</h2>
<div class="grid2">
  <label class="field"><span>默认结果条数</span><input type="text" id="maxResults" inputmode="numeric" placeholder="8"></label>
  <label class="field"><span>Bing 市场</span><input type="text" id="bingMarket" placeholder="zh-CN"></label>
</div>
<div class="footer">
  <button id="saveMisc">保存</button>
  <span class="status" id="miscStatus"></span>
</div>

<script src="/settings.js"></script>
</body>
</html>
