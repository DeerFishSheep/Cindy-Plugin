<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A6API 渠道</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="status">
      <span id="dot" class="dot connecting" aria-hidden="true"></span>
      <span id="authText">正在连接…</span>
      <span id="balance" class="balance"></span>
    </div>
    <button id="reloadBtn" class="icon-btn" type="button" title="重新拉取榜单" aria-label="刷新">↻</button>
  </div>

  <div id="banner" class="banner" hidden></div>

  <section class="card">
    <div class="card-head">
      <h2>筛选</h2>
      <button id="resetBtn" class="link" type="button">重置</button>
    </div>

    <div class="grid2">
      <label class="field">
        <span class="flabel">品牌</span>
        <input id="brand" list="brandList" placeholder="DeepSeek" autocomplete="off" spellcheck="false">
        <datalist id="brandList"></datalist>
      </label>
      <label class="field">
        <span class="flabel">模型</span>
        <input id="model" list="modelList" placeholder="先选品牌" autocomplete="off" spellcheck="false">
        <datalist id="modelList"></datalist>
      </label>
    </div>

    <div class="grid2">
      <label class="field"><span class="flabel">缓存 ≥</span><input id="minCache" type="number" inputmode="numeric" placeholder="80"><span class="funit">%</span></label>
      <label class="field"><span class="flabel">成功率 ≥</span><input id="minSr" type="number" inputmode="numeric" placeholder="95"><span class="funit">%</span></label>
    </div>
    <div class="grid2">
      <label class="field"><span class="flabel">倍率 ≤</span><input id="maxRatio" type="number" step="0.001" inputmode="decimal" placeholder="0.1"></label>
      <label class="field"><span class="flabel">样本 ≥</span><input id="minSample" type="number" inputmode="numeric" placeholder="不限"></label>
    </div>
    <div class="grid2">
      <label class="field"><span class="flabel">首字 ≤</span><input id="maxTtft" type="number" step="0.5" inputmode="decimal" placeholder="5"><span class="funit">秒</span></label>
      <label class="field"><span class="flabel">吞吐 ≥</span><input id="minTps" type="number" inputmode="numeric" placeholder="不限"><span class="funit">tok/s</span></label>
    </div>

    <div class="checks">
      <label class="chk"><input id="onlyQualified" type="checkbox" checked><span>只输出达标</span></label>
      <label class="chk"><input id="guaranteed" type="checkbox"><span>仅保真商家</span></label>
    </div>

    <button id="runBtn" class="btn primary block" type="button">开始筛选</button>
    <p id="msg" class="msg"></p>
  </section>

  <section class="card card-rank">
    <div class="card-head">
      <div class="seg" role="tablist" aria-label="排序方式">
        <button class="seg-btn active" type="button" data-mode="score" role="tab" aria-selected="true">综合</button>
        <button class="seg-btn" type="button" data-mode="value" role="tab" aria-selected="false">性价比</button>
      </div>
      <span id="summary" class="summary"></span>
      <button id="copyBtn" class="link" type="button">复制</button>
    </div>
    <div id="list" class="list">
      <div class="empty">还没有榜单。选好模型后点「开始筛选」。</div>
    </div>
  </section>

  <section class="card">
    <div id="pinStatus" class="pin-status">当前固定 · 未设置</div>

    <div class="row">
      <select id="tokenSelect" class="select" aria-label="固定用令牌">
        <option value="">（没有令牌）</option>
      </select>
      <button id="tokensBtn" class="btn ghost compact" type="button">刷新令牌</button>
    </div>

    <div id="loginRow" class="row">
      <button id="syncBtn" class="btn" type="button">同步浏览器登录</button>
      <button id="pasteBtn" class="btn ghost" type="button">粘贴 Cookie</button>
    </div>

    <div id="pasteBox" class="paste" hidden>
      <textarea id="cookieInput" rows="3" placeholder="粘贴 a6api.com 的整串 Cookie（开发者工具 → Network → 任意请求 → Cookie）" spellcheck="false"></textarea>
      <div class="row">
        <input id="userIdInput" class="input" inputmode="numeric" placeholder="用户 ID（可留空自动解析）">
        <button id="saveCookieBtn" class="btn primary compact" type="button">保存并验证</button>
      </div>
      <p class="hint">Cookie 直接交给 Cindy 保险库，不经过对话、不写日志。</p>
    </div>

    <div class="row">
      <button id="logoutBtn" class="link danger" type="button">退出登录</button>
    </div>
    <p id="loginMsg" class="msg"></p>
  </section>
</div>

<dialog id="detailDlg" class="dlg">
  <div class="dlg-head">
    <h3 id="detailTitle">渠道详情</h3>
    <button class="icon-btn" type="button" data-close="detailDlg" aria-label="关闭">×</button>
  </div>
  <div id="detailBody" class="dlg-body"></div>
</dialog>

<dialog id="compareDlg" class="dlg">
  <div class="dlg-head">
    <h3>渠道对比</h3>
    <button class="icon-btn" type="button" data-close="compareDlg" aria-label="关闭">×</button>
  </div>
  <div class="dlg-body">
    <div class="cmp-pick">
      <select id="cmpLeft" class="select" aria-label="左侧渠道"></select>
      <span class="cmp-vs">vs</span>
      <select id="cmpRight" class="select" aria-label="右侧渠道"></select>
    </div>
    <div id="cmpBody"></div>
  </div>
</dialog>

<script src="bridge.js"></script>
<script src="panel.js"></script>
</body>
</html>
