<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A6API 渠道筛选</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
<header class="bar">
      <span class="dot" id="health"></span>
      <h1>渠道筛选</h1>
      <span class="grow"></span>
      <span class="bal" id="balance"></span>
      <button class="btn" id="loginBtn">登录</button>
      <button class="btn" id="refresh" title="重新拉取">刷新</button>
    </header>

    <main>
      <section class="sect">
        <div class="sect-head">查询条件 <span class="sum" id="scopeSum"></span></div>
        <div class="field" id="tokenRow" hidden>
          <span class="lab">令牌</span>
          <select id="tokenSel"></select>
          <button class="btn" id="tokenRefresh" type="button" title="刷新令牌列表">↻</button>
        </div>

        <div class="grid2">
          <div class="field">
            <span class="lab">品牌</span>
            <select id="brand"></select>
          </div>
          <div class="field">
            <span class="lab">模型</span>
            <input id="model" placeholder="deepseek-v4.1-flash" spellcheck="false" autocomplete="off" />
            <div class="suggest" id="modelSuggest" hidden></div>
          </div>
        </div>

        <div class="grid2">
          <div class="field">
            <span class="lab">缓存≥</span>
            <input id="minCache" type="number" min="0" max="100" placeholder="0" />
            <span class="unit">%</span>
          </div>
          <div class="field">
            <span class="lab">成功率≥</span>
            <input id="minSr" type="number" min="0" max="100" placeholder="0" />
            <span class="unit">%</span>
          </div>
        </div>

        <div class="grid2">
          <div class="field">
            <span class="lab">倍率≤</span>
            <input id="maxRatio" type="number" step="0.01" min="0" placeholder="不限" />
          </div>
          <div class="field">
            <span class="lab">样本≥</span>
            <input id="minSample" type="number" min="0" placeholder="0" />
          </div>
        </div>

        <div class="grid2">
          <div class="field">
            <span class="lab">首字≤</span>
            <input id="maxTtft" type="number" min="0" placeholder="不限" />
            <span class="unit">ms</span>
          </div>
          <div class="field">
            <span class="lab">吞吐≥</span>
            <input id="minTps" type="number" min="0" placeholder="0" />
          </div>
        </div>

        <div class="chks">
          <label class="chk">
            <input type="checkbox" id="guaranteed" />
            <span>仅保真渠道</span>
          </label>
          <label class="chk">
            <input type="checkbox" id="onlyQualified" checked />
            <span>只输出达标</span>
          </label>
        </div>
        <button class="run" id="run">查询渠道</button>
        <p class="msg" id="msg"></p>
      </section>

      <section class="sect" id="resultSect" hidden>
        <div class="sect-head">
          排名
          <div class="seg" id="seg">
            <button data-k="score" class="active">综合</button>
            <button data-k="value">性价比</button>
            <button data-k="fav">收藏</button>
          </div>
          <button class="btn" id="favRefresh" title="重新拉取收藏渠道的最新数据" hidden>刷新</button>
          <button class="btn" id="copyBtn" title="复制当前榜单为文本">复制</button>
          <span class="sum" id="rankSum"></span>
        </div>
        <div class="list" id="list"></div>
      </section>
    </main>

    <dialog id="loginDlg">
      <form method="dialog" class="dlg" id="loginForm">
        <h2>A6API 登录</h2>
        <p>「同步浏览器登录」会读取本机 Chrome / Edge / Brave 里已经登录的 a6api 会话，不用手抄 cookie。</p>
        <button type="button" class="btn primary" id="syncLogin" style="width: 100%; height: 30px">同步浏览器登录</button>
        <p id="loginMsg"></p>
        <div class="field">
          <span class="lab">Cookie</span>
          <input id="cookieInput" placeholder="或直接粘贴 session=..." spellcheck="false" />
        </div>
        <p>或者用账号密码登录（走站点 /api/user/login，拿到的 Cookie 同样存进保险库）。</p>
        <div class="field">
          <span class="lab">账号</span>
          <input id="userInput" placeholder="a6api 用户名" spellcheck="false" autocomplete="username" />
        </div>
        <div class="field">
          <span class="lab">密码</span>
          <input id="passInput" type="password" placeholder="密码" autocomplete="current-password" />
        </div>
        <button type="button" class="btn primary" id="passLogin" style="width: 100%; height: 30px">账号密码登录</button>
        <div class="dlg-foot">
          <button type="button" class="btn" id="logoutBtn" hidden>退出登录</button>
          <span style="flex: 1"></span>
          <button type="button" class="btn" id="loginCancel">关闭</button>
          <button type="button" class="btn primary" id="cookieSave">用这个 Cookie</button>
        </div>
      </form>
    </dialog>

    <dialog id="cmpDlg">
      <div class="dlg">
        <h2>商家对比</h2>
        <div id="cmpBody"></div>
        <div class="dlg-foot">
          <button type="button" class="btn" id="cmpClose">关闭</button>
        </div>
      </div>
    </dialog>

    <div class="toast" id="toast"></div>
    <script src="bridge.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
